<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>
</head>
<body>
<h1>Product List</h1>
<a th:href="@{/home}">Home</a>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>In Stock</th>
    </tr>
    <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td><a th:href="@{/product/{id}(id=${p.id})}" th:text="${p.name}"></a></td>
        <td th:text="${p.price}"></td>
        <td th:text="${p.inStock} ? 'Yes' : 'No'"></td>
    </tr>
</table>
</body>
</html>
