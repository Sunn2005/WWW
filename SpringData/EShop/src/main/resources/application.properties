spring.application.name=EShop
server.port=8080

# ===== MariaDB =====
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3\
  306/eshop}
spring.datasource.username=${DB_USERNAME:root}
# Doi mat khau theo may cua ban
spring.datasource.password=${DB_PASSWORD:12345678}

# ===== JPA / Hibernate =====
# Bang da duoc tao bang eShop.sql nen khong cho Hibernate tao/sua bang
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Cho phep Thymeleaf doc quan he LAZY (vd: product.category.name)
spring.jpa.open-in-view=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== JWT =====
# Khoa bi mat Base64, toi thieu 256 bit (32 byte). Moi nhom tu sinh khoa rieng, KHONG commit len Git that.
app.jwt.secret=N45bb7tsq8gOEJgSwlOh2QJ88qa66XO66l2+9pGjnM/YI0zwef4ob8hrFuifheOM
# Thoi han token: 1 ngay
app.jwt.expiration-ms=86400000

logging.level.org.springframework.security=DEBUG

# ===== Spring AI (OpenAI) =====
# Chay bang bien moi truong, KHONG ghi key that vao file nay.
#   export OPENAI_API_KEY="sk-..."
spring.ai.openai.api-key=${GEMINI_API_KEY:}
spring.ai.openai.chat.model=gpt-5-nano
spring.ai.openai.chat.temperature=0.7
spring.ai.model.chat=openai
